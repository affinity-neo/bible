<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 잠언</title>
<style>
  :root { --bg:#faf8f3; --fg:#2b2723; --muted:#8a8279; --accent:#6b4f2a; --line:#e6e0d4; --hl:#f3e6c4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1b19; --fg:#e8e3da; --muted:#9a9288; --accent:#d1a964; --line:#38342f; --hl:#3d3320; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif; line-height:1.95; }
  main { max-width:640px; margin:0 auto; padding:28px 20px 140px; }
  header { text-align:center; margin-bottom:18px; }
  .date { color:var(--muted); font-size:.9rem; font-family:system-ui,sans-serif; }
  h1 { margin:.2em 0 0; font-size:1.8rem; color:var(--accent); }

  .player { position:sticky; top:0; background:var(--bg); padding:12px 0 10px;
    border-bottom:1px solid var(--line); margin-bottom:22px; z-index:2;
    font-family:system-ui,sans-serif; }
  .ctrl { display:flex; align-items:center; justify-content:center; gap:14px; }
  .ctrl button { border:1px solid var(--line); background:transparent; color:var(--fg);
    width:42px; height:42px; border-radius:50%; cursor:pointer; font-size:1rem; }
  .ctrl #play { width:52px; height:52px; background:var(--accent); color:var(--bg);
    border-color:var(--accent); font-size:1.1rem; }
  .speed { display:flex; gap:6px; justify-content:center; margin-top:10px; flex-wrap:wrap; }
  .speed button { border:1px solid var(--line); background:transparent; color:var(--fg);
    padding:4px 11px; border-radius:999px; cursor:pointer; font-size:.82rem; }
  .speed button.on { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  .voice { margin-top:10px; text-align:center; }
  .voice select { max-width:100%; font-size:.82rem; padding:4px 6px; border-radius:6px;
    border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  .note { color:var(--muted); font-size:.88rem; text-align:center; margin:8px 0 0; }

  .verse { margin:0 0 .35em; padding:.3em .6em; font-size:1.1rem; border-radius:8px;
    cursor:pointer; transition:background .25s; }
  .verse sup { color:var(--accent); font-size:.7rem; margin-right:6px; font-family:system-ui,sans-serif; }
  .verse.on { background:var(--hl); }
</style>
</head>
<body>
<main>
  <header>
    <div class="date" id="date"></div>
    <h1 id="title"></h1>
  </header>

  <div class="player">
    <div class="ctrl">
      <button id="prev" aria-label="이전 구절">&#9664;&#9664;</button>
      <button id="play" aria-label="재생">&#9654;</button>
      <button id="next" aria-label="다음 구절">&#9654;&#9654;</button>
    </div>
    <div class="speed" id="speed"></div>
    <div class="voice"><select id="voice" aria-label="음성 선택"></select></div>
    <p class="note" id="note" hidden></p>
  </div>

  <article id="text"></article>
</main>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var now = new Date();
  var day = parseInt(params.get('day'), 10) || now.getDate();
  if (day < 1 || day > 31) day = now.getDate();

  document.getElementById('date').textContent =
    now.getFullYear() + '년 ' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일';
  document.getElementById('title').textContent = '잠언 ' + day + '장';
  document.title = '오늘의 잠언 - 잠언 ' + day + '장';

  var box = document.getElementById('text');
  var note = document.getElementById('note');
  var playBtn = document.getElementById('play');
  var verses = [];        // 구절 본문 배열
  var els = [];           // 구절 DOM 배열
  var idx = 0;            // 현재 구절
  var playing = false;
  var session = 0;        // 취소된 낭독의 onend 무시용
  var rate = 1;
  try { rate = parseFloat(localStorage.getItem('rate')) || 1; } catch (e) {}

  function say(msg) { note.hidden = !msg; note.textContent = msg || ''; }

  // ---- 본문 불러오기: text/NN.txt (한 줄에 한 구절, 앞에 절 번호) ----
  function parseText(raw) {
    var lines = raw.replace(/\r/g, '').split('\n')
      .map(function (l) { return l.trim(); }).filter(Boolean);
    var numbered = lines.some(function (l) { return /^\d+[\.\)]?\s*\S/.test(l); });
    if (!numbered) return lines;
    var out = [];
    lines.forEach(function (l) {
      var m = l.match(/^\d+[\.\)]?\s*(.*)$/);
      if (m && m[1]) out.push(m[1]);
      else if (out.length) out[out.length - 1] += ' ' + l;   // 번호 없는 줄은 앞 구절에 이어붙임
    });
    return out;
  }

  function render() {
    box.innerHTML = '';
    els = verses.map(function (v, i) {
      var p = document.createElement('p');
      p.className = 'verse';
      var s = document.createElement('sup');
      s.textContent = i + 1;
      p.appendChild(s);
      p.appendChild(document.createTextNode(v));
      p.onclick = function () { speakFrom(i); };
      box.appendChild(p);
      return p;
    });
    mark(0, false);
  }

  fetch('text/' + String(day).padStart(2, '0') + '.txt', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (t) {
      verses = parseText(t);
      if (!verses.length) throw new Error('empty');
      render();
    })
    .catch(function () {
      box.innerHTML = '<p class="note">text/' + String(day).padStart(2, '0') +
        '.txt 파일을 불러오지 못했습니다. (파일이 없거나, 파일을 직접 열어서 본 경우입니다. 웹 주소로 접속해 주세요.)</p>';
    });

  // ---- 음성 (브라우저 내장 한국어 TTS) ----
  var synth = window.speechSynthesis;
  var voiceSel = document.getElementById('voice');
  var voice = null;

  if (!synth) {
    say('이 브라우저는 음성 읽기를 지원하지 않습니다. 크롬, 엣지, 사파리를 사용해 주세요.');
    playBtn.disabled = true;
  }

  function scoreVoice(v) {
    var n = (v.name || '').toLowerCase(), s = 0;
    if (/natural|neural|online/.test(n)) s += 4;
    if (/sunhi|injoon|heami|yuna|google/.test(n)) s += 2;
    if (v.localService === false) s += 1;
    return s;
  }
  function loadVoices() {
    if (!synth) return;
    var list = synth.getVoices().filter(function (v) { return /^ko/i.test(v.lang); });
    list.sort(function (a, b) { return scoreVoice(b) - scoreVoice(a); });
    var saved = null;
    try { saved = localStorage.getItem('voice'); } catch (e) {}
    voiceSel.innerHTML = '';
    list.forEach(function (v) {
      var o = document.createElement('option');
      o.value = v.name; o.textContent = v.name;
      voiceSel.appendChild(o);
    });
    if (!list.length) {
      voiceSel.hidden = true;
      voice = null;
      say('한국어 음성을 찾지 못했습니다. 기기에 한국어 음성이 설치되어 있는지 확인해 주세요.');
      return;
    }
    voiceSel.hidden = list.length < 2;
    var pick = list.filter(function (v) { return v.name === saved; })[0] || list[0];
    voiceSel.value = pick.name;
    voice = pick;
    say('');
  }
  if (synth) {
    loadVoices();
    synth.onvoiceschanged = loadVoices;
  }
  voiceSel.onchange = function () {
    var list = synth.getVoices();
    voice = list.filter(function (v) { return v.name === voiceSel.value; })[0] || voice;
    try { localStorage.setItem('voice', voiceSel.value); } catch (e) {}
    if (playing) speakFrom(idx);
  };

  function mark(i, scroll) {
    els.forEach(function (e, k) { e.classList.toggle('on', k === i); });
    idx = i;
    if (scroll && els[i]) els[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function setPlaying(p) {
    playing = p;
    playBtn.innerHTML = p ? '&#10074;&#10074;' : '&#9654;';
    playBtn.setAttribute('aria-label', p ? '일시정지' : '재생');
  }

  function speakFrom(i) {
    if (!synth || !verses.length) return;
    if (i < 0) i = 0;
    if (i >= verses.length) { stop(); mark(0, true); return; }
    session++;
    var mine = session;
    synth.cancel();
    mark(i, true);
    setPlaying(true);
    var u = new SpeechSynthesisUtterance(verses[i]);
    u.lang = 'ko-KR';
    if (voice) u.voice = voice;
    u.rate = rate;
    u.onend = function () { if (mine === session && playing) speakFrom(i + 1); };
    u.onerror = function () { /* 취소로 인한 오류는 무시 */ };
    // cancel 직후 바로 speak하면 일부 브라우저에서 무시되므로 약간 지연
    setTimeout(function () { if (mine === session) synth.speak(u); }, 60);
  }
  function stop() {
    session++;
    if (synth) synth.cancel();
    setPlaying(false);
  }

  playBtn.onclick = function () { playing ? stop() : speakFrom(idx); };
  document.getElementById('prev').onclick = function () { playing ? speakFrom(idx - 1) : mark(Math.max(0, idx - 1), true); };
  document.getElementById('next').onclick = function () { playing ? speakFrom(idx + 1) : mark(Math.min(verses.length - 1, idx + 1), true); };

  // 배속
  var speedWrap = document.getElementById('speed');
  var speeds = [0.75, 1, 1.25, 1.5, 1.75, 2];
  function setSpeed(r, restart) {
    rate = r;
    Array.prototype.forEach.call(speedWrap.children, function (b) {
      b.classList.toggle('on', parseFloat(b.dataset.r) === r);
    });
    try { localStorage.setItem('rate', r); } catch (e) {}
    if (restart && playing) speakFrom(idx);   // 낭독 중이면 현재 구절부터 새 속도로
  }
  speeds.forEach(function (r) {
    var b = document.createElement('button');
    b.textContent = r + 'x';
    b.dataset.r = r;
    b.onclick = function () { setSpeed(r, true); };
    speedWrap.appendChild(b);
  });
  setSpeed(rate, false);

  window.addEventListener('pagehide', stop);
})();
</script>
</body>
</html>
