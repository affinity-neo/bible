<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 잠언</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Gothic:wght@400;700&family=Gaegu:wght@400;700&family=Hi+Melody&family=Yeon+Sung&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root { --bg:#f7f4ee; --fg:#27302c; --muted:#78837d; --accent:#3d6b5b; --line:#e5e0d3; --hl:#e3eee7;
    --card:color-mix(in srgb,var(--bg),white 55%);
    --ff:'Gowun Batang','Noto Serif KR',serif; --ui:'Gowun Dodum','Noto Sans KR',system-ui,sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161b19; --fg:#e5ebe7; --muted:#8f9a94; --accent:#8cc4ad; --line:#2a3330; --hl:#22342d;
      --card:color-mix(in srgb,var(--bg),white 7%); }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font-family:var(--ff); line-height:1.95;
    -webkit-text-size-adjust:100%; }
  main { max-width:640px; margin:0 auto; padding:28px 20px 140px; }
  header { text-align:center; margin-bottom:18px; }
  .date { color:var(--muted); font-size:.9rem; font-family:var(--ui); }
  h1 { margin:.2em 0 0; font-size:1.8rem; color:var(--accent); }

  .player { position:sticky; top:0; background:var(--bg); padding:12px 0 10px;
    border-bottom:1px solid var(--line); margin-bottom:22px; z-index:2;
    font-family:var(--ui); }
  .row { display:flex; align-items:center; gap:10px; }
  .row button { border:1px solid var(--line); background:transparent; color:var(--fg);
    width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:.8rem; flex:none; }
  .row #play { width:46px; height:46px; background:var(--accent); color:var(--bg);
    border-color:var(--accent); font-size:1rem; }
  #seek { flex:1; min-width:0; accent-color:var(--accent); }
  #time { color:var(--muted); font-size:.78rem; min-width:80px; text-align:right; font-variant-numeric:tabular-nums; }
  .speed { display:flex; gap:6px; justify-content:center; margin-top:10px; flex-wrap:wrap; }
  .speed button { border:1px solid var(--line); background:transparent; color:var(--fg);
    padding:4px 11px; border-radius:999px; cursor:pointer; font-size:.82rem; }
  .speed button.on { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  .note { color:var(--muted); font-size:.85rem; text-align:center; margin:8px 0 0; }

  .verse { margin:0 0 .35em; padding:.3em .6em; font-size:1.1rem; border-radius:8px;
    cursor:pointer; transition:background .25s; }
  .verse sup { color:var(--accent); font-size:.7rem; margin-right:6px; font-family:var(--ui); }
  .verse.on { background:var(--hl); }

  .game { margin-top:40px; font-family:var(--ui); }
  .game .lock { text-align:center; color:var(--muted); font-size:.88rem; margin:0; }
  .game h2 { margin:0 0 4px; text-align:center; color:var(--accent); font-family:inherit; font-size:1.2rem; }
  .game .sub { text-align:center; color:var(--muted); font-size:.86rem; margin:0 0 14px; line-height:1.6; }
  .game canvas.gcv { display:block; width:100%; max-width:420px; margin:0 auto; aspect-ratio:360/520;
    border-radius:16px; border:1px solid var(--line); touch-action:manipulation; cursor:pointer;
    -webkit-tap-highlight-color:transparent; outline:none; background:#cfe6f7; }
  .game .gobox { text-align:center; margin-top:14px; }
  .game .gotitle { font-size:1.05rem; color:var(--accent); font-weight:700; }
  .game .godesc { color:var(--muted); font-size:.86rem; margin:6px 0 0; line-height:1.6; }
  .game .go { display:inline-block; margin-top:12px; padding:11px 24px; border-radius:999px; border:0;
    background:var(--accent); color:var(--bg); font-size:.95rem; cursor:pointer; }
  .game .stage { max-width:420px; margin:0 auto; }
  .game .dm-top { display:flex; justify-content:space-between; font-weight:700; color:var(--accent); margin-bottom:6px; }
  .game .dm-bar { height:10px; border-radius:6px; background:var(--line); overflow:hidden; }
  .game .dm-bar i { display:block; height:100%; width:100%; background:linear-gradient(90deg,#5aa9e6,#8bd0f5); }
  .game .dm-msg { min-height:1.6em; text-align:center; font-size:.9rem; margin:10px 0; }
  .game .crowd { min-height:150px; display:flex; flex-wrap:wrap; gap:1px; justify-content:center; align-content:flex-start; margin:6px 0 10px; }
  .game .pop { animation:pop .25s ease-out; }
  @keyframes pop { from { transform:scale(.3); opacity:0; } to { transform:scale(1); opacity:1; } }
  .game .bread { display:block; margin:6px auto 0; width:170px; height:170px; border-radius:50%; border:0; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #ffd98a, #e39a3b 70%); color:#5a3410; font-size:1.7rem; font-weight:800;
    box-shadow:0 6px 0 #b86f1f, 0 12px 20px rgba(0,0,0,.18); user-select:none; -webkit-user-select:none;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent; font-family:inherit; }
  .game .bread:active { transform:translateY(4px); box-shadow:0 2px 0 #b86f1f; }
  .game .bread small { display:block; font-size:.8rem; font-weight:600; }
  .game .mgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .game .mc { aspect-ratio:1/1.05; perspective:600px; border:0; background:transparent; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .game .mc .in { position:relative; display:block; width:100%; height:100%; transition:transform .35s; transform-style:preserve-3d; }
  .game .mc.open .in, .game .mc.done .in { transform:rotateY(180deg); }
  .game .mc .f, .game .mc .b { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:12px; display:flex; align-items:center; justify-content:center; }
  .game .mc .f { background:var(--accent); color:var(--bg); font-size:1.5rem; font-weight:800; }
  .game .mc .b { transform:rotateY(180deg); background:var(--hl); border:2px solid var(--line); }
  .game .mc.done .b { border-color:#7aa56a; }
  .game .wface { text-align:center; margin:8px 0; min-height:70px; }
  .game .wtxt { font-size:1rem; line-height:1.7; margin:6px 0 12px; }
  .game .wopts { display:grid; gap:8px; }
  .game .wopts button { text-align:left; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
    background:transparent; color:var(--fg); font-size:.93rem; font-family:inherit; cursor:pointer; line-height:1.5; }
  .game .wopts button.ok { background:#dcebd3; border-color:#7aa56a; color:#26421c; }
  .game .wopts button.mid { background:#fbf0cf; border-color:#d9b64a; color:#5a4410; }
  .game .wopts button.no { background:#f3d9d6; border-color:#c27b72; color:#5b241e; }
  .game .wr { margin:14px 0 4px; font-size:.95rem; line-height:1.6; }
  .game .wref { margin:0; font-size:.8rem; color:var(--muted); line-height:1.5; }
  .game .stage .go { display:block; margin:12px auto 0; }
  .game .pcs { display:grid; gap:10px; }
  .game .pc { border-radius:14px; border:2px solid var(--line); padding:14px; min-height:84px; background:var(--accent); color:var(--bg);
    cursor:pointer; text-align:left; font-family:inherit; display:block; width:100%; position:relative; -webkit-tap-highlight-color:transparent; }
  .game .pc .pq { display:block; text-align:center; font-size:1.8rem; font-weight:800; }
  .game .pc.open { background:var(--bg); color:var(--fg); cursor:default; animation:pop .3s ease-out; }
  .game .pc.other { opacity:.55; }
  .game .pc .prar { display:inline-block; font-size:.75rem; font-weight:800; padding:2px 8px; border-radius:999px; background:var(--line); }
  .game .pc .pf { float:right; margin-left:8px; }
  .game .pc .pv { display:block; font-family:var(--ff); font-size:.95rem; line-height:1.8; margin-top:6px; }
  .game .pc .pv sup { color:var(--accent); font-family:var(--ui); margin-right:5px; font-size:.7rem; }
  .game .pc.r1 { border-color:#4f8fd6; box-shadow:0 0 12px rgba(79,143,214,.45); }
  .game .pc.r1 .prar { background:#4f8fd6; color:#fff; }
  .game .pc.r2 { border-color:#e0b020; box-shadow:0 0 16px rgba(224,176,32,.7); background:linear-gradient(135deg,var(--bg),var(--hl)); }
  .game .pc.r2 .prar { background:#e0b020; color:#3a2a00; }
  .game .pc.mine { outline:3px solid var(--accent); outline-offset:2px; opacity:1; }

  .chnav { display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-top:36px; padding-top:18px; border-top:1px solid var(--line);
    font-family:var(--ui); }
  .chnav a { display:inline-flex; align-items:center; gap:8px; padding:12px 18px; border-radius:999px;
    border:1px solid var(--line); color:var(--fg); text-decoration:none; font-size:.95rem; cursor:pointer;
    -webkit-tap-highlight-color:transparent; }
  .chnav a:active { background:var(--hl); }
  .chnav a.off { visibility:hidden; }
  .chnav #chToday { background:var(--accent); color:var(--bg); border-color:var(--accent); font-size:.85rem; padding:10px 16px; }
  .chnav a[hidden] { display:none; }

  /* 소리만 사용하는 유튜브 플레이어: 화면 밖에 둠 */
  #yt { position:absolute; left:-9999px; width:200px; height:200px; }

  /* 구절 시간 기록 도구 (주소 뒤에 ?record=1) */
  #rec { margin-top:12px; padding:10px; border:1px dashed var(--accent); border-radius:10px;
    font-family:var(--ui); font-size:.85rem; }
  #rec button { padding:8px 14px; border-radius:8px; border:0; background:var(--accent);
    color:var(--bg); cursor:pointer; font-size:.9rem; margin-right:6px; }
  #rec button.sub { background:transparent; color:var(--fg); border:1px solid var(--line); }
  #rec textarea { width:100%; height:110px; margin-top:8px; background:var(--bg); color:var(--fg);
    border:1px solid var(--line); border-radius:6px; font-size:.8rem; }

  .game .jgrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .game .jg { aspect-ratio:1; border:3px solid var(--line); border-radius:20px; cursor:pointer; transition:transform .08s, filter .08s; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .game .jg.lit { filter:brightness(1.3) saturate(1.3); transform:scale(.94); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent); }

  .svg-ic, svg.ic { width:1.1em; height:1.1em; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  svg.fi { width:1em; height:1em; fill:currentColor; flex:none; }
  [data-ic] { display:inline-flex; align-items:center; }
  .game .lock { font-size:.86rem; }
  .game .ghead { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:12px; }
  .game .ghead h2 { margin:0; font-size:1.2rem; }
  .ibtn { width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--muted); display:grid; place-items:center; cursor:pointer; padding:0; }
  .ibtn svg { width:15px; height:15px; }
  .game .sub { max-width:420px; margin:0 auto 14px; padding:10px 14px; background:var(--card); border:1px solid var(--line); border-radius:12px; text-align:left; }
  .game .sub[hidden] { display:none; }
  .game .bread { background:radial-gradient(circle at 35% 30%, #f7dca8, #dca457 72%); box-shadow:0 6px 0 #b98440, 0 12px 20px rgba(0,0,0,.14); }
  .game .bread:active { box-shadow:0 2px 0 #b98440; }
  .row button svg { width:18px; height:18px; }
  .row #play svg { width:20px; height:20px; }
  .chnav a svg { width:16px; height:16px; }
  .me { margin-top:40px; text-align:center; font-family:var(--ui); }
  .shopbtn { display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 22px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--accent); font-family:var(--ui); font-size:.95rem; font-weight:700; cursor:pointer; transition:background .2s,border-color .2s; }
  .shopbtn:hover { background:var(--hl); border-color:var(--accent); }
  .shopbtn:active { transform:translateY(1px); }
  .shopbtn svg { width:18px; height:18px; }
  #gameBox { --bg:#f8f1e2; --fg:#43362a; --muted:#8a7864; --accent:#4f6f5c; --line:#e2d5bd; --hl:#efe5cc; --card:#fffaf0;
    color:var(--fg); border:10px solid transparent; border-radius:22px; padding:14px 12px 16px;
    background:linear-gradient(var(--bg),var(--bg)) padding-box,repeating-linear-gradient(91deg,rgba(0,0,0,.055) 0 1px,transparent 1px 9px) border-box,linear-gradient(180deg,#9a7352,#6a4c36) border-box;
    box-shadow:0 0 0 1px #4d3626,0 12px 26px rgba(60,40,20,.2); }
  #toast { position:fixed; left:50%; bottom:max(24px,env(safe-area-inset-bottom)); transform:translate(-50%,16px); max-width:88vw; padding:11px 18px; border-radius:14px; background:#26302b; color:#f3f6f4; font:.9rem/1.5 var(--ui); opacity:0; pointer-events:none; transition:.25s; z-index:200; text-align:center; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  .shop-ov { position:fixed; inset:0; z-index:100; background:radial-gradient(80% 60% at 50% 30%,rgba(120,80,40,.5),rgba(18,10,5,.85)); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center;
    padding:max(14px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom)); font-family:'Gowun Dodum','Noto Sans KR',sans-serif; color-scheme:dark; }
  .shop-ov[hidden] { display:none; }
  @keyframes shopIn { from { transform:translateY(18px) scale(.96); opacity:0; } }
  .shop-win { position:relative; width:100%; max-width:520px; height:min(780px,100%); display:flex; flex-direction:column; border-radius:26px; overflow:hidden; color:#fff2d6;
    background:radial-gradient(90% 38% at 50% 0%,rgba(255,200,120,.28),transparent 70%),radial-gradient(70% 30% at 100% 100%,rgba(120,190,110,.14),transparent 70%),
      repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 1px,transparent 1px 11px),repeating-linear-gradient(90deg,rgba(255,220,160,.045) 0 3px,transparent 3px 23px),
      repeating-linear-gradient(180deg,transparent 0 118px,rgba(20,10,4,.55) 118px 121px,rgba(255,220,160,.12) 121px 123px),
      linear-gradient(180deg,#6e4a2e,#573823 55%,#432a19);
    box-shadow:0 0 0 2px #2a1709,0 0 0 4px rgba(240,196,110,.55),0 0 0 7px rgba(240,196,110,.08),0 30px 70px rgba(10,5,2,.7),inset 0 0 0 2px rgba(255,225,170,.18),inset 0 0 60px rgba(20,10,4,.35); animation:shopIn .24s ease-out; }
  .shop-top { flex:none; position:relative; display:flex; align-items:center; justify-content:center; padding:18px 56px 10px; }
  .shop-sign { position:relative; display:flex; align-items:center; padding:9px 32px; border-radius:14px; border:1px solid #2f1b0c;
    background:repeating-linear-gradient(90deg,rgba(80,45,15,.14) 0 2px,transparent 2px 10px),linear-gradient(180deg,#e2b073,#c48c50 55%,#a8733b);
    box-shadow:0 4px 0 #2f1b0c,0 10px 18px rgba(10,5,2,.4),inset 0 1px 0 rgba(255,240,200,.65),inset 0 -2px 0 rgba(70,35,10,.25); }
  .shop-sign::before,.shop-sign::after { content:''; position:absolute; top:50%; width:8px; height:8px; margin-top:-4px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff1c4,#a67a2c 70%); box-shadow:0 1px 1px rgba(30,15,5,.6); }
  .shop-sign::before { left:11px; } .shop-sign::after { right:11px; }
  .shop-title { display:flex; align-items:center; gap:9px; font-family:'Noto Sans KR','Gowun Dodum',sans-serif; font-weight:800; font-size:1.3rem; letter-spacing:.03em; color:#fff6dc; text-shadow:0 2px 0 #6a4220,0 0 10px rgba(255,220,150,.4); }
  .shop-title svg { width:22px; height:22px; color:#fff1c4; }
  .shop-x { position:absolute; right:14px; top:16px; width:36px; height:36px; border-radius:50%; border:1px solid #2f1b0c; color:#fff0cc;
    background:linear-gradient(#8c6240,#5e3f27); display:grid; place-items:center; padding:0; cursor:pointer; box-shadow:0 3px 0 #2f1b0c,inset 0 1px 0 rgba(255,235,190,.4); transition:transform .12s; }
  .shop-x:hover { filter:brightness(1.12); } .shop-x:active { transform:translateY(2px); box-shadow:0 1px 0 #2f1b0c; }
  .shop-x svg { width:16px; height:16px; }
  .shop-in { flex:1; min-height:0; display:flex; flex-direction:column; }
  .shop-acct { flex:none; padding:4px 14px 8px; font-size:.88rem; line-height:1.6; color:#f4e3c0; }
  .acrow { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px; }
  .acrow + .acrow { margin-top:8px; }
  .chip { display:inline-flex; align-items:center; gap:7px; padding:6px 14px; border-radius:999px; background:rgba(25,12,4,.45); border:1px solid rgba(240,196,110,.45); color:#fff2d6; font-size:.86rem; box-shadow:inset 0 2px 4px rgba(0,0,0,.3),0 1px 0 rgba(255,225,170,.18); }
  .chip svg { width:16px; height:16px; color:#ffd36b; }
  .chip b { color:#ffe08a; font-variant-numeric:tabular-nums; }
  .grow { display:none; }
  .lnk { border:0; background:none; color:#ffd77a; font:inherit; font-weight:700; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:4px; text-shadow:0 1px 2px rgba(20,10,4,.6); }
  .acnote { display:none; }
  .acform { display:flex; gap:6px; width:100%; }
  .acform input { flex:1; min-width:0; padding:9px 14px; border-radius:12px; border:1px solid rgba(240,196,110,.5); background:rgba(25,12,4,.5); font:inherit; color:#fff6e0; outline:none; box-shadow:inset 0 2px 4px rgba(0,0,0,.35); }
  .acform input:focus { border-color:#ffd36b; box-shadow:inset 0 2px 4px rgba(0,0,0,.35),0 0 0 3px rgba(255,211,107,.22); }
  .acform button { padding:9px 16px; border-radius:12px; border:1px solid #2f1b0c; background:linear-gradient(#ffe08a,#e8a22c); color:#3a2406; font:inherit; font-weight:800; cursor:pointer; box-shadow:0 2px 0 #2f1b0c,inset 0 1px 0 rgba(255,255,255,.6); }
  .shop-body { flex:1; min-height:0; overflow-y:auto; scrollbar-gutter:stable; scrollbar-color:rgba(240,196,110,.5) transparent; -webkit-overflow-scrolling:touch; padding:6px 14px 18px; }
  .stabs { display:flex; gap:6px; overflow-x:auto; padding:5px; margin:0 0 6px; justify-content:safe center; scrollbar-width:none; background:rgba(25,12,4,.5); border:1px solid rgba(0,0,0,.4); border-radius:14px; box-shadow:inset 0 3px 6px rgba(0,0,0,.4),0 1px 0 rgba(255,225,170,.2); }
  .stabs::-webkit-scrollbar { display:none; }
  .stabs button,.bsw button { flex:none; min-height:34px; padding:0 15px; border-radius:10px; border:0; background:transparent; color:#d9bf94; font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:.85rem; cursor:pointer; transition:background .15s,color .15s; }
  .stabs button:hover,.bsw button:hover { color:#fff; }
  .stabs button.on,.bsw button.on { background:linear-gradient(#f4cd84,#d99a48); color:#3a2208; box-shadow:0 2px 0 #2f1b0c,0 4px 10px rgba(240,170,60,.3),inset 0 1px 0 rgba(255,255,255,.6); }
  .sinfo { display:none; }
  .sgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:14px 10px; margin-top:12px; padding-bottom:6px; }
  .sc { position:relative; overflow:hidden; height:178px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:12px 6px 10px; text-align:center; border-radius:16px; border:1px solid #d8c7a3;
    background:#fbf4e2; color:#5a3b22; box-shadow:0 5px 0 #2a1709,0 12px 18px rgba(10,5,2,.4),inset 0 1px 0 rgba(255,255,255,.8); transition:transform .15s; }
  .sc:hover { transform:translateY(-2px); }
  .sc::before { content:''; position:absolute; left:50%; top:78px; width:70px; height:12px; margin-left:-35px; border-radius:50%; background:radial-gradient(closest-side,rgba(90,60,30,.22),transparent); }
  .sc.on { border-color:#f0b43a; box-shadow:0 0 0 3px #f0b43a,0 0 22px rgba(255,200,90,.6),0 5px 0 #2a1709,inset 0 1px 0 rgba(255,255,255,.8); }
  .sc canvas { position:relative; flex:none; width:80px !important; height:77px !important; filter:drop-shadow(0 3px 3px rgba(90,60,30,.25)); }
  .sc .sn { position:relative; flex:1; display:flex; align-items:center; justify-content:center; font-size:.8rem; font-weight:700; line-height:1.2; margin:4px 0 5px; color:#5a3b22; }

<body>
<main>
  <header>
    <div class="date" id="date"></div>
    <h1 id="title"></h1>
  </header>

  <div class="player">
    <div class="row">
      <button id="prev" aria-label="이전 구절" data-ic="prev"></button>
      <button id="play" aria-label="재생" data-ic="play"></button>
      <button id="next" aria-label="다음 구절" data-ic="next"></button>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="재생 위치">
      <span id="time">0:00 / 0:00</span>
    </div>
    <div class="speed" id="speed"></div>
    <p class="note" id="note" hidden></p>
    <div id="rec" hidden></div>
  </div>

  <article id="text"></article>

  <section id="game" class="game">
    <p id="gameLock" class="lock">끝까지 들으면 미니 게임이 열려요.</p>
    <div id="gameBox" hidden>
      <div class="ghead"><h2 id="gameName"></h2><button class="ibtn" id="gameInfo" aria-label="게임 방법 보기" aria-expanded="false" data-ic="info"></button></div>
      <p class="sub" id="gameDesc" hidden></p>
      <div id="gameArea"></div>
      <div id="goBox" class="gobox" hidden>
        <div class="gotitle" id="goTitle"></div>
        <p class="godesc" id="goDesc"></p>
        <button class="go" id="goAgain">다시 도전</button>
      </div>
    </div>
  </section>

  <nav class="chnav" aria-label="장 이동">
    <a id="chPrev" aria-label="이전 장"><span data-ic="left"></span><span id="chPrevT"></span></a>
    <a id="chToday" hidden>오늘</a>
    <a id="chNext" aria-label="다음 장"><span id="chNextT"></span><span data-ic="right"></span></a>
  </nav>

  <section class="me" id="me">
    <button class="shopbtn" id="shopBtn"><span data-ic="shop"></span>나무 상점</button>
  </section>
</main>

<div class="shop-ov" id="shopOv" hidden>
  <div class="shop-win" role="dialog" aria-modal="true" aria-label="나무 상점">
    <div class="shop-top">
      <div class="shop-sign"><div class="shop-title">나무 상점</div></div>
      <button class="shop-x" id="shopX" aria-label="닫기" data-ic="close"></button>
    </div>
    <div class="shop-in">
      <div class="shop-acct" id="shopAcct"></div>
      <div class="shop-body"><div class="stabs" id="stabs"></div><p class="sinfo" id="sinfo"></p><div class="sgrid" id="sgrid"></div><div id="sboard" hidden></div></div>
      <div class="shop-msg" id="shopMsg"></div>
    </div>
  </div>
</div>
<div id="toast" role="status"></div>
<div id="yt"></div>

<script>
// 장별 유튜브 영상 ID (소리만 사용). 장을 추가할 때 한 줄씩 넣으세요.
var VIDEOS = {
  1: 'fxXb5ubK3N8',
  2: 'ff-2m6X0y7w',
  3: '99TnAal46E0',
  4: 'ItLbaNuM_c0',
  5: '2CYLB4g8sfI',
  6: '1GO8Z55Smns',
  7: 'DxhkgIFXzkg',
  8: 'KHZMsuV-GNk',
  9: 'wYRZFlmv63c',
  10: 'RCexzbff_N8',
  11: 'mv37KOLRW94',
  12: 'gw7RGYJ3e5E',
  13: 'ppzxYySjD2M',

  15: 'N8zMGuUjSE0',
  16: 'khdQuf3ZmG8',
  17: 'aQGU9-nbFMk',
  18: 'fgT6EJm-2l8',
  19: 'UD7ELzI3Sn8',
  20: 'oX1nKv3hreU',
  21: 'wtio2sQlvZI',
  22: 'W6CJvvDEXuY',
  23: 'pnyMgDTydsc',
  24: 'rWoiOLEs808',
  25: 'JEQRIIJ4JtU',
  26: 'gsIqfyMacAo',
  27: 'bN9xh1gj6Iw',
  28: 'HWY_2JFFBt8',
  29: 'nwoOgrTjkGA',
  30: 'hjg0-Q7Hv00',
  31: '_ftnRDjFiRM'
};

(function () {
  // ---- 아이콘 (이모지 대신 SVG) ----
  var IC = (function () {
    function st(p) { return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + p + '</svg>'; }
    function fi(p) { return '<svg class="fi" viewBox="0 0 24 24" aria-hidden="true">' + p + '</svg>'; }
    return {
      play: fi('<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10-6.5a1 1 0 0 0 0-1.72l-10-6.5A1 1 0 0 0 8 5.5z"/>'),
      pause: fi('<rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/>'),
      prev: fi('<path d="M18 6.2v11.6a.9.9 0 0 1-1.4.75l-7.2-5.8a.9.9 0 0 1 0-1.5l7.2-5.8A.9.9 0 0 1 18 6.2z"/><rect x="5" y="5.5" width="2.6" height="13" rx="1"/>'),
      next: fi('<path d="M6 6.2v11.6a.9.9 0 0 0 1.4.75l7.2-5.8a.9.9 0 0 0 0-1.5L7.4 5.45A.9.9 0 0 0 6 6.2z"/><rect x="16.4" y="5.5" width="2.6" height="13" rx="1"/>'),
      left: st('<path d="M15 5l-7 7 7 7"/>'), right: st('<path d="M9 5l7 7-7 7"/>'),
      info: st('<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/>'),
      close: st('<path d="M6 6l12 12M18 6L6 18"/>'),
      shop: st('<path d="M3.5 10.5L12 4l8.5 6.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/>'),
      book: st('<path d="M12 6.5C10 5 7.5 4.6 4.5 5v13c3-.4 5.5 0 7.5 1.5 2-1.5 4.5-1.9 7.5-1.5V5c-3-.4-5.5 0-7.5 1.5z"/><path d="M12 6.5v13"/>'),
      game: st('<circle cx="12" cy="12" r="9"/><path d="M12 7.5l1.4 3 3.2.4-2.4 2.2.7 3.2-2.9-1.7-2.9 1.7.7-3.2-2.4-2.2 3.2-.4z"/>'),
      user: st('<circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-3.8 3.6-5.5 7-5.5s6.2 1.7 7 5.5"/>'),
      trophy: st('<path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H4.5c0 3 1.2 4.5 3.5 5M16 6h3.5c0 3-1.2 4.5-3.5 5"/><path d="M12 13v4M8.5 20h7M10 17h4"/>')
    };
  })();
  function icoFill(root) { Array.prototype.forEach.call((root || document).querySelectorAll('[data-ic]'), function (e) { e.innerHTML = IC[e.getAttribute('data-ic')] || ''; }); }
  icoFill();
  var toastT = null;
  function toast(t) {
    var e = document.getElementById('toast'); e.textContent = t; e.className = 'show';
    clearTimeout(toastT); toastT = setTimeout(function () { e.className = ''; }, 3400);
  }

  var params = new URLSearchParams(location.search);
  var now = new Date();
  var day = parseInt(params.get('day'), 10) || now.getDate();
  if (day < 1 || day > 31) day = now.getDate();
  var nn = String(day).padStart(2, '0');
  var recordMode = params.get('record') === '1';

  document.getElementById('date').textContent =
    now.getFullYear() + '년 ' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일';
  document.getElementById('title').textContent = '잠언 ' + day + '장';
  document.title = '오늘의 잠언 - 잠언 ' + day + '장';

  // ---- 장 이동 화살표 (기본은 오늘 날짜의 장) ----
  var today = now.getDate();
  function chHref(n) {
    var p = new URLSearchParams(location.search);
    if (n === today) p.delete('day'); else p.set('day', n);
    var q = p.toString();
    return location.pathname + (q ? '?' + q : '');
  }
  (function () {
    var prev = document.getElementById('chPrev'), next = document.getElementById('chNext');
    var tdy = document.getElementById('chToday');
    if (day > 1) {
      prev.href = chHref(day - 1);
      document.getElementById('chPrevT').textContent = ' ' + (day - 1) + '장';
    } else prev.classList.add('off');
    if (day < 31) {
      next.href = chHref(day + 1);
      document.getElementById('chNextT').textContent = (day + 1) + '장 ';
    } else next.classList.add('off');
    if (day !== today) {
      tdy.hidden = false;
      tdy.href = chHref(today);
      tdy.textContent = '오늘(' + today + '장)';
    }
  })();

  var box = document.getElementById('text');
  var note = document.getElementById('note');
  var playBtn = document.getElementById('play');
  var seek = document.getElementById('seek');
  var timeEl = document.getElementById('time');
  var speedWrap = document.getElementById('speed');
  function say(msg) { note.hidden = !msg; note.textContent = msg || ''; }

  var verses = [], els = [];
  var times = null;        // text/NN.time.txt 에서 읽은 정확한 구절 시작 시간(초)
  var est = null, estDur = 0;   // 파일이 없을 때 글자 수로 계산한 대략의 시간
  var curIdx = -1;
  var api = null, dragging = false;
  var rate = 1;
  try { rate = parseFloat(localStorage.getItem('rate')) || 1; } catch (e) {}

  // ---- 본문: text/NN.txt (한 줄에 한 구절, 앞에 절 번호) ----
  function parseText(raw) {
    var lines = raw.replace(/\r/g, '').split('\n')
      .map(function (l) { return l.trim(); }).filter(Boolean);
    var numbered = lines.some(function (l) { return /^\d+[\.\)]?\s*\S/.test(l); });
    if (!numbered) return lines;
    var out = [];
    lines.forEach(function (l) {
      var m = l.match(/^\d+[\.\)]?\s*(.*)$/);
      if (m && m[1]) out.push(m[1]);
      else if (out.length) out[out.length - 1] += ' ' + l;
    });
    return out;
  }

  // ---- 시간표: text/NN.time.txt (한 줄에 구절 시작 시간 하나. 예: 0:05 또는 5.2) ----
  function parseTimes(raw) {
    return raw.replace(/\r/g, '').split('\n').map(function (l) { return l.trim(); })
      .filter(Boolean).map(function (l) {
        var tok = l.split(/\s+/).pop();
        if (tok.indexOf(':') >= 0) {
          var p = tok.split(':');
          return parseFloat(p[0]) * 60 + parseFloat(p[1]);
        }
        return parseFloat(tok);
      }).filter(function (n) { return !isNaN(n); });
  }

  function render() {
    box.innerHTML = '';
    els = verses.map(function (v, i) {
      var p = document.createElement('p');
      p.className = 'verse';
      var s = document.createElement('sup');
      s.textContent = i + 1;
      p.appendChild(s);
      p.appendChild(document.createTextNode(v));
      p.onclick = function () {
        if (recordMode) return;
        var ts = getTimes();
        if (ts && api) { api.seekTo(ts[i]); api.play(); }
      };
      box.appendChild(p);
      return p;
    });
  }

  fetch('text/' + nn + '.txt', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (t) {
      verses = parseText(t);
      if (!verses.length) throw new Error('empty');
      render();
      if (recordMode) setupRecorder();
    })
    .catch(function () {
      box.innerHTML = '<p class="note">text/' + nn + '.txt 파일을 불러오지 못했습니다. (파일이 없거나, 파일을 직접 열어서 본 경우입니다. 웹 주소로 접속해 주세요.)</p>';
    });

  fetch('text/' + nn + '.time.txt', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (t) { var a = parseTimes(t); if (a.length) times = a; })
    .catch(function () {});

  // 구절 시작 시간: 정확한 시간표가 있으면 그것, 없으면 글자 수 비율로 대략 계산
  function getTimes() {
    if (!verses.length) return null;
    if (times) {
      var t = times.slice();
      while (t.length < verses.length) t.push(t[t.length - 1] + 5);
      return t;
    }
    var d = api ? api.dur() : 0;
    if (d > 0) {
      if (!est || estDur !== d) {
        var w = verses.map(function (v) { return v.length + 8; });
        var tot = w.reduce(function (a, b) { return a + b; }, 0), acc = 0;
        est = w.map(function (x) { var s = acc / tot * d; acc += x; return s; });
        estDur = d;
      }
      return est;
    }
    return null;
  }

  // ---- 끝까지 들었는지 확인 (건너뛰기로는 열리지 않음) ----
  var listened = 0, lastCur = null, unlocked = false;
  var forceUnlock = params.get('unlock') === '1';   // 테스트용: ?unlock=1
  function trackListening() {
    if (!api || unlocked) return;
    var c = api.cur();
    if (api.isPlaying() && lastCur !== null) {
      var d = c - lastCur;
      if (d > 0 && d < 1.5 * rate + 0.5) listened += d;   // 정상 재생으로 흘러간 시간만 합산
    }
    lastCur = c;
  }
  function onEnded() {
    var d = api ? api.dur() : 0;
    if (d > 0 && listened >= d * 0.85) { awardWord(); openGame(); }
    else say('영상을 건너뛰지 않고 처음부터 끝까지 들으셔야 미니 게임이 열립니다.');
  }
  if (forceUnlock) setTimeout(openGame, 800);

  // ======== 미니 게임 모음: 장 번호에 따라 매일 다른 게임이 열립니다 ========
  // 1장=방주 쌓기, 2장=만나 받기, 3장=오병이어, 4장=요나, 5장=짝 맞추기, 6장=홍해, 7장=다니엘, 8장=여리고, 9장=다시 방주 쌓기 ...
  var QUIZ_DAYS = [10, 24];   // 한 달에 두 번: 이 날짜의 장에서는 말씀 퀴즈가 열립니다
  var GAME_ORDER = ['stack', 'manna', 'loaves', 'jonah', 'match', 'redsea', 'daniel', 'jericho'];
  var GAMES = {};
  var gameCleanup = null, curGame = null;

  function gameKey() {
    var g = params.get('game');            // 테스트용: ?game=david&unlock=1
    if (g && GAMES[g]) return g;
    if (QUIZ_DAYS.indexOf(day) >= 0 && GAMES.quiz) return 'quiz';
    return GAME_ORDER[(day - 1) % GAME_ORDER.length];
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // ---- 공용: 귀여운 동물 그리기 ----

      for (k = 0; k <= 8; k++) { a = Math.PI + k / 8 * Math.PI; ctx.beginPath(); ctx.ellipse(cx + Math.cos(a) * s * 1.3, y + 6 + Math.sin(a) * s * 0.85, 5.5, 2.6, a + Math.PI / 2, 0, 6.3); ctx.fill(); ctx.stroke(); }
    }
  }
  // 사람 캐릭터 (동물과 같은 틀 안에 그려서 장신구가 똑같이 맞습니다)
  function drawPerson(ctx, x, y, w, h, S, mood, look) {
    var cx = x + w / 2, cy = y + h / 2, sp = Math.max(6, Math.min(w * 0.22, 16)), ey = cy - 4, i, lx = (look || 0) * 1.6;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 2.2; ctx.strokeStyle = 'rgba(80,50,25,.4)';
    if (S.glow) { var gg = ctx.createRadialGradient(cx, cy, w * .2, cx, cy, w * .85); gg.addColorStop(0, 'rgba(255,230,150,.65)'); gg.addColorStop(1, 'rgba(255,230,150,0)'); ctx.fillStyle = gg; ctx.fillRect(x - w * .5, y - h * .7, w * 2, h * 2.4); ctx.strokeStyle = 'rgba(80,50,25,.4)'; ctx.lineWidth = 2.2; }
    if (S.style === 'long') { ctx.fillStyle = S.hair; rrect(ctx, x - 4, y - 3, w + 8, h + 12, 16); ctx.fill(); ctx.stroke(); }
    else { ctx.fillStyle = S.skin; for (i = -1; i <= 1; i += 2) { ctx.beginPath(); ctx.arc(cx + i * w / 2, cy + 1, 5, 0, 6.3); ctx.fill(); ctx.stroke(); } }
    ctx.fillStyle = S.skin; rrect(ctx, x, y, w, h, 14); ctx.fill();
    var gr = ctx.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, 'rgba(255,255,255,.35)'); gr.addColorStop(1, 'rgba(120,60,20,.1)');
    ctx.fillStyle = gr; rrect(ctx, x, y, w, h, 14); ctx.fill(); rrect(ctx, x, y, w, h, 14); ctx.stroke();
    ctx.fillStyle = S.hair; ctx.beginPath(); ctx.moveTo(x, y + h * 0.42); ctx.arcTo(x, y, x + w, y, 14); ctx.arcTo(x + w, y, x + w, y + h, 14); ctx.lineTo(x + w, y + h * 0.42);
    ctx.quadraticCurveTo(cx + w * 0.22, y + h * 0.16, cx, y + h * 0.34); ctx.quadraticCurveTo(cx - w * 0.22, y + h * 0.14, x, y + h * 0.42); ctx.closePath(); ctx.fill(); ctx.stroke();
    if (S.scarf) { ctx.fillStyle = S.scarf; rrect(ctx, x - 1, y + h * 0.1, w + 2, h * 0.17, 5); ctx.fill(); ctx.stroke(); }
    if (S.beard) { ctx.fillStyle = S.beard; ctx.beginPath(); ctx.ellipse(cx, y + h * 0.92, w * 0.4, h * 0.34, 0, 0, 6.3); ctx.fill(); ctx.stroke(); }
    ctx.strokeStyle = '#2b2723'; ctx.fillStyle = '#2b2723'; ctx.lineWidth = 2.2;
    if (mood === 'happy') { for (i = -1; i <= 1; i += 2) { ctx.beginPath(); ctx.arc(cx + i * sp, ey + 3, 4, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); } }
    else if (mood === 'ouch') { for (i = -1; i <= 1; i += 2) { ctx.beginPath(); ctx.moveTo(cx + i * sp + i * 4, ey - 5); ctx.lineTo(cx + i * sp - i * 3, ey); ctx.lineTo(cx + i * sp + i * 4, ey + 5); ctx.stroke(); } }
    else { for (i = -1; i <= 1; i += 2) { ctx.fillStyle = '#2b2723'; ctx.beginPath(); ctx.ellipse(cx + i * sp + lx, ey, 4.2, 5, 0, 0, 6.3); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + i * sp + lx + 1.3, ey - 1.7, 1.6, 0, 6.3); ctx.fill(); } }
    if (w >= 34) { ctx.fillStyle = 'rgba(255,110,130,.5)'; for (i = -1; i <= 1; i += 2) { ctx.beginPath(); ctx.ellipse(cx + i * (sp + 9), ey + 9, 6, 3.6, 0, 0, 6.3); ctx.fill(); } }
    if (mood === 'ouch') { ctx.fillStyle = '#7a2d2d'; ctx.beginPath(); ctx.ellipse(cx, ey + 11, 3.5, 4.5, 0, 0, 6.3); ctx.fill(); }
    else { ctx.strokeStyle = '#7a3f2a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, ey + 6, 5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
  }
  function drawChar(ctx, x, y, w, h, ch, mood, look) { if (ch.h) drawPerson(ctx, x, y, w, h, ch.h, mood, look); else drawAnimal(ctx, x, y, w, h, ch.k, mood, look); }
  function drawHero(ctx, x, y, w, h, mood, look) { drawChar(ctx, x, y, w, h, heroChar(), mood, look); drawAcc(ctx, x, y, w, h, P.eq); }
  function previewEl(ch, eq) {
    var c = document.createElement('canvas'), d = 2; c.width = 100 * d; c.height = 96 * d; c.style.width = '88px'; c.style.height = '84px';
    var x = c.getContext('2d'); x.scale(d, d); drawChar(x, 18, 30, 64, 44, ch, 'smile', 0); drawAcc(x, 18, 30, 64, 44, eq); return c;
  }

  // ---- 꾸미기 상점 (나무 상점 팝업) ----
  var shopTab = 'ch', pend = '', boardType = 'wc', boardTok = 0;
  var TABS = [['ch', '캐릭터'], ['hat', '모자'], ['face', '얼굴'], ['neck', '목'], ['theme', '테마'], ['font', '글꼴'], ['rank', '순위']];
  function openShop() { document.getElementById('shopOv').hidden = false; document.body.style.overflow = 'hidden'; pend = ''; meMsg(''); renderAcct(); renderShop(); }
  function closeShop() { document.getElementById('shopOv').hidden = true; document.body.style.overflow = ''; }
  function renderBoard() {
    var b = document.getElementById('sboard'), tok = ++boardTok;
    b.innerHTML = '<div class="bsw"><button data-t="wc"' + (boardType === 'wc' ? ' class="on"' : '') + '>' + IC.book + '말씀 코인</button><button data-t="gc"' + (boardType === 'gc' ? ' class="on"' : '') + '>' + IC.game + '게임 코인</button></div><div id="blist"></div>';
    Array.prototype.forEach.call(b.querySelectorAll('.bsw button'), function (x) { x.onclick = function () { boardType = x.getAttribute('data-t'); renderBoard(); }; });
    var L = document.getElementById('blist');
    if (!db) { L.textContent = '인터넷에 연결되면 순위를 볼 수 있어요.'; return; }
    L.textContent = '불러오는 중...';
    var fld = boardType === 'wc' ? 'wtot' : 'gtot';
    db.collection('users').orderBy(fld, 'desc').limit(10).get().then(function (s) {
      if (tok !== boardTok) return;
      var h = '', i = 0;
      s.forEach(function (d) { var v = d.data(); i++; h += '<div class="brow' + (v.name === user ? ' mine' : '') + '"><span class="rk">' + i + '</span><span class="nm">' + esc(v.name) + '</span><b>' + (v[fld] || 0).toLocaleString() + '</b></div>'; });
      L.innerHTML = h || '아직 순위에 오른 친구가 없어요.';
    }).catch(function () { if (tok === boardTok) L.textContent = '순위를 불러오지 못했어요.'; });
  }
  function renderShop() {
    var ov = document.getElementById('shopOv'); if (!ov || ov.hidden) return;
    var cur = (shopTab === 'ch' || shopTab === 'theme' || shopTab === 'font') ? 'gc' : 'wc';
    var tb = document.getElementById('stabs'); tb.innerHTML = '';
    TABS.forEach(function (t) {
      var b = document.createElement('button'); b.textContent = t[1]; if (t[0] === shopTab) b.className = 'on';
      b.onclick = function () { shopTab = t[0]; pend = ''; meMsg(''); renderShop(); }; tb.appendChild(b);
    });
    var INFO = { ch: '게임 코인으로 동물과 인물을 살 수 있어요.', theme: '게임 코인으로 화면 색을 바꿔요.', font: '게임 코인으로 글씨체를 바꿔요.', rank: '지금까지 모은 코인을 기준으로 한 순위예요.' };
    document.getElementById('sinfo').textContent = INFO[shopTab] || '말씀 코인으로 꾸미기 아이템을 살 수 있어요.';
    var grid = document.getElementById('sgrid'), board = document.getElementById('sboard');
    if (shopTab === 'rank') { grid.hidden = true; board.hidden = false; renderBoard(); return; }
    grid.hidden = false; board.hidden = true; grid.innerHTML = '';
    var list = shopTab === 'ch' ? CHARS : shopTab === 'theme' ? THEMES : shopTab === 'font' ? FONTS : [{ id: '', v: '', n: '없음', p: 0 }].concat(ITEMS.filter(function (i) { return i.s === shopTab; }));
    list.forEach(function (it) {
      var owned = it.p === 0 || P.own.indexOf(it.id) >= 0;
      var on = shopTab === 'ch' ? P.eq.ch === it.id : shopTab === 'theme' ? (P.eq.theme || 'auto') === it.t : shopTab === 'font' ? (P.eq.font || 'default') === it.f : P.eq[shopTab] === it.v;
      var card = document.createElement('div'); card.className = 'sc' + (on ? ' on' : '') + (owned && it.p > 0 ? ' owned' : '');
      if (shopTab === 'theme') {
        card.insertAdjacentHTML('beforeend', '<div class="swatch" style="background:' + it.c[0] + ';border-color:' + it.c[2] + '"><i style="background:' + it.c[2] + '"></i><b style="color:' + it.c[1] + '">가나다</b></div>');
      } else if (shopTab === 'font') {
        card.insertAdjacentHTML('beforeend', '<div class="fsw" style="font-family:' + it.ff + '">말씀</div>');
      } else {
        var eq = Object.assign({}, P.eq); if (shopTab !== 'ch') eq[shopTab] = it.v;
        card.appendChild(previewEl(shopTab === 'ch' ? it : heroChar(), eq));
      }
      card.insertAdjacentHTML('beforeend', '<div class="sn">' + it.n + '</div>');
      var b = document.createElement('button');
      b.innerHTML = on ? '사용 중' : owned ? '사용하기' : (pend && pend === it.id ? '한 번 더!' : it.p + (cur === 'gc' ? IC.game : IC.book)); b.disabled = on;
      b.className = (pend && pend === it.id) ? 'conf' : (owned && it.p > 0 ? 'own' : '');
      b.onclick = function () {
        if (!owned) {
          if (P[cur] < it.p) { meMsg('코인이 ' + (it.p - P[cur]) + '개 모자라요. ' + (cur === 'gc' ? '게임을 하면 게임 코인이 쌓여요.' : '말씀을 끝까지 들으면 말씀 코인이 쌓여요.')); return; }
          if (pend !== it.id) { pend = it.id; meMsg(it.n + ' - 한 번 더 누르면 구매해요.'); renderShop(); return; }
          pend = ''; P[cur] -= it.p; P.own.push(it.id); var f = { own: union(it.id) }; f[cur] = inc(-it.p); cloud(f);
          meMsg(it.n + ' 구매 완료!');
        }
        if (shopTab === 'ch') P.eq.ch = it.id; else if (shopTab === 'theme') P.eq.theme = it.t; else if (shopTab === 'font') P.eq.font = it.f; else P.eq[shopTab] = it.v;
        saveLocal(); cloud({ eq: P.eq }); applyTheme(); renderAcct(); renderShop();
      };
      card.appendChild(b); grid.appendChild(card);
    });
  }
  document.getElementById('shopBtn').onclick = openShop;
  document.getElementById('shopX').onclick = closeShop;
  document.getElementById('shopOv').addEventListener('pointerdown', function (e) { if (e.target === this) closeShop(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeShop(); });
  loadProfile();


  // ---- 재생 위치에 맞춰 하이라이트 이동 ----
  function mark(i, scroll) {
    if (i === curIdx) return;
    curIdx = i;
    els.forEach(function (e, k) { e.classList.toggle('on', k === i); });
    if (scroll && i >= 0 && els[i]) els[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function syncHighlight() {
    if (!api || recordMode) return;
    var ts = getTimes();
    if (!ts) return;
    var c = api.cur() + 0.15, idx = -1;
    for (var k = 0; k < ts.length; k++) { if (ts[k] <= c) idx = k; else break; }
    mark(idx, api.isPlaying());
  }

  // ---- 플레이어 UI ----
  function fmt(t) {
    t = Math.max(0, Math.floor(t || 0));
    return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  }
  function refresh() {
    if (!api) return;
    var d = api.dur(), c = api.cur();
    if (!dragging && d > 0) seek.value = Math.round(c / d * 1000);
    timeEl.textContent = fmt(c) + ' / ' + fmt(d);
    playBtn.innerHTML = api.isPlaying() ? IC.pause : IC.play;
    syncHighlight();
    trackListening();
  }
  setInterval(refresh, 200);

  playBtn.onclick = function () {
    if (!api) return;
    api.isPlaying() ? api.pause() : api.play();
    setTimeout(refresh, 100);
  };
  seek.addEventListener('input', function () { dragging = true; });
  seek.addEventListener('change', function () {
    dragging = false;
    if (api && api.dur() > 0) { api.seekTo(seek.value / 1000 * api.dur()); setTimeout(refresh, 100); }
  });
  function jump(delta) {
    var ts = getTimes();
    if (!ts || !api) return;
    var i = Math.min(ts.length - 1, Math.max(0, curIdx + delta));
    api.seekTo(ts[i]);
    setTimeout(refresh, 100);
  }
  document.getElementById('prev').onclick = function () { jump(-1); };
  document.getElementById('next').onclick = function () { jump(1); };

  var speeds = [0.75, 1, 1.25, 1.5, 1.75, 2];
  function setSpeed(r) {
    rate = r;
    if (api) api.setRate(r);
    Array.prototype.forEach.call(speedWrap.children, function (b) {
      b.classList.toggle('on', parseFloat(b.dataset.r) === r);
    });
    try { localStorage.setItem('rate', r); } catch (e) {}
  }
  speeds.forEach(function (r) {
    var b = document.createElement('button');
    b.textContent = r + 'x';
    b.dataset.r = r;
    b.onclick = function () { setSpeed(r); };
    speedWrap.appendChild(b);
  });
  setSpeed(rate);

  // ---- 유튜브 음성 (소리만 사용) ----
  var vid = VIDEOS[day];
  if (!vid) {
    say('잠언 ' + day + '장 음성이 아직 연결되지 않았습니다. (index.html 의 VIDEOS 에 영상 ID를 추가해 주세요)');
    playBtn.disabled = true;
  } else {
    window.onYouTubeIframeAPIReady = function () {
      var player = new YT.Player('yt', {
        width: '200', height: '200', videoId: vid,
        playerVars: { playsinline: 1, controls: 0, rel: 0, fs: 0, disablekb: 1, modestbranding: 1 },
        events: {
          onReady: function () {
            api = {
              play: function () { player.playVideo(); },
              pause: function () { player.pauseVideo(); },
              isPlaying: function () { return player.getPlayerState() === 1; },
              seekTo: function (t) { player.seekTo(t, true); },
              cur: function () { return player.getCurrentTime() || 0; },
              dur: function () { return player.getDuration() || 0; },
              setRate: function (r) { player.setPlaybackRate(r); }
            };
            setSpeed(rate);
            if (!times && !recordMode) say('구절 시간표(text/' + nn + '.time.txt)가 없어서 하이라이트가 대략적으로 움직입니다.');
          },
          onStateChange: function (e) {
            if (e.data === 1) player.setPlaybackRate(rate);
            if (e.data === 0) { trackListening(); onEnded(); }   // 재생 끝
          },
          onError: function () {
            say('이 영상은 외부 사이트에서 재생할 수 없도록 설정되어 있습니다. 영상 소유자에게 퍼가기 허용을 요청해 주세요.');
          }
        }
      });
    };
    var s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  }

  // ---- 구절 시간 기록 도구 ----
  function setupRecorder() {
    var rec = document.getElementById('rec');
    rec.hidden = false;
    rec.innerHTML =
      '<div id="recMsg"></div>' +
      '<div style="margin-top:8px"><button id="recMark">구절 시작</button>' +
      '<button class="sub" id="recUndo">되돌리기</button></div>' +
      '<textarea id="recOut" readonly></textarea>' +
      '<div style="margin-top:6px;color:var(--muted)">끝나면 위 내용을 복사해서 text/' + nn + '.time.txt 로 저장하세요.</div>';
    var got = [];
    var msg = document.getElementById('recMsg');
    var out = document.getElementById('recOut');
    function show() {
      msg.textContent = got.length < verses.length
        ? '영상을 재생하고, ' + (got.length + 1) + '절 읽기가 시작되는 순간 [구절 시작]을 누르세요. (' + got.length + '/' + verses.length + ')'
        : '모든 구절을 기록했습니다.';
      out.value = got.map(function (t) { return t.toFixed(1); }).join('\n');
      els.forEach(function (e, k) { e.classList.toggle('on', k === got.length); });
      if (els[got.length]) els[got.length].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    document.getElementById('recMark').onclick = function () {
      if (!api || got.length >= verses.length) return;
      got.push(api.cur());
      show();
    };
    document.getElementById('recUndo').onclick = function () { got.pop(); show(); };
    show();
  }

  window.addEventListener('pagehide', function () { if (api) api.pause(); });
})();
</script>
